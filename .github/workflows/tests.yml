name: Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *' # 15 phút một lần cho nó thong thả ní ạ
  push:
    branches: [ main ]

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
        
      - name: Create Private Key File
        run: |
          echo "${{ secrets.OCI_SSH_PRIVATE_KEY_CONTENTS }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Run Hunt Bot
        run: |
          vendor/bin/phpunit --color tests/
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_OC }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME: ./private_key.pem
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          # Mặc định Singapore AD-1
          OCI_AVAILABILITY_DOMAIN: "ap-singapore-1-AD-1"
          OCI_SHAPE: "VM.Standard.A1.Flex"
          OCI_OCPUS: 4
          OCI_MEMORY_IN_GBS: 24
          OCI_MAX_INSTANCES: 1
